name: Pre-releases

# An alpha, beta, or rc tag based on manifest.json's version publishes a draft
# prerelease whose artifact manifest carries the complete tag as its version.
# Tag and version handling lives in .github/ci/release.sh.

on:
  push:
    tags:
    - '*'

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check if tag does not match manifest version
      id: check
      run: .github/ci/release.sh check beta "$GITHUB_REF_NAME"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: npm ci
    - run: npm test
    - run: npm run lint
    - run: npm run release
      env:
        FREELAY_VERSION: ${{ github.ref_name }}
    - name: Set release artifact manifest version
      run: .github/ci/release.sh set-version "$GITHUB_REF_NAME"
    - name: Generate artifact attestations
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-path: |
          main.js
          styles.css
          manifest.json
    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        artifacts: "main.js,styles.css,manifest.json"
        name: ${{ github.ref_name }}
        draft: true
        prerelease: true
